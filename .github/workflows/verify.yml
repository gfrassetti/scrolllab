name: verify

# El gate del repo (`npm run verify`): lint + typecheck + tests + invariantes.
# Corre sobre el commit limpio que se subió, sin los archivos a medias de nadie,
# así que cualquier rojo es del código que está en GitHub. No toca producción.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama no cancela al anterior en master (cada commit
# queda chequeado); en un pull request sí, porque solo importa el último.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Un Mongo real para el contrato de los repositorios (server/__tests__/
    # repoContract.mongo.test.js): las consultas, los índices únicos y las
    # transiciones atómicas de producción no se pueden probar contra archivos.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Los tests y el typecheck no necesitan navegador: no se baja Chromium.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # REQUIRE_MONGO: sin Mongo el contrato se saltearía y el CI pasaría en falso.
      - run: npm run verify
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017
          REQUIRE_MONGO: '1'
