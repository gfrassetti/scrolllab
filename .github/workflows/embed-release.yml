name: embed-release

# ¿Hay una versión de @scrolllab/embed para publicar en npm? Compara
# packages/embed con lo que hay en el registro y abre (o actualiza) un aviso
# asignado al dueño del repo. NUNCA publica: la publicación la hace una persona,
# con su cuenta de npm y su verificación en dos pasos (ver docs/embed-release.md).
on:
  push:
    branches: [master]
    paths:
      - 'packages/embed/**'
      - 'scripts/check-embed-release.mjs'
      - 'scripts/lib/embed-release.mjs'
      - '.github/workflows/embed-release.yml'
  # Una vez por día: cierra el aviso cuando alguien ya publicó (publicar en npm
  # no dispara ningún push) y detecta cambios que entraron por otro camino.
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: embed-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin dependencias: el chequeo solo lee package.json y el registro público.
      - name: Comparar con npm
        id: cmp
        run: |
          node scripts/check-embed-release.mjs --json > release.json
          cat release.json
          echo "status=$(jq -r .status release.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .localVersion release.json)" >> "$GITHUB_OUTPUT"

      # El paquete armado, para bajarlo y mirarlo antes de publicar.
      - name: Armar el paquete
        if: steps.cmp.outputs.status == 'publish'
        working-directory: packages/embed
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent

      - uses: actions/upload-artifact@v4
        if: steps.cmp.outputs.status == 'publish'
        with:
          name: scrolllab-embed-${{ steps.cmp.outputs.version }}
          path: ${{ runner.temp }}/scrolllab-embed-*.tgz
          retention-days: 30

      - name: Abrir, actualizar o cerrar el aviso
        env:
          STATUS: ${{ steps.cmp.outputs.status }}
          VERSION: ${{ steps.cmp.outputs.version }}
        run: |
          set -euo pipefail
          LABEL="npm-publish"
          gh label create "$LABEL" --color 0e8a16 --description "Hay una versión de @scrolllab/embed para publicar" 2>/dev/null || true
          OPEN=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          REASON=$(jq -r .reason release.json)
          LATEST=$(jq -r '.latest // "ninguna"' release.json)
          CHANGES=$(jq -r '[(.diff.changed[]? | "- cambiado: `" + . + "`"), (.diff.added[]? | "- nuevo: `" + . + "`"), (.diff.removed[]? | "- sacado: `" + . + "`")] | join("\n")' release.json)

          if [ "$STATUS" = "up-to-date" ]; then
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "Ya está publicada la **$VERSION** en npm y coincide con el repo. Cierro el aviso."
              gh issue close "$OPEN"
            fi
            exit 0
          fi

          # Plantillas con marcadores: heredoc entre comillas, sin expansión.
          case "$STATUS" in
            publish)
              TITLE="Publicar @scrolllab/embed $VERSION en npm"
              ACTION=$(cat <<'TEMPLATE'
          1. Iniciá sesión (una vez):

          ```bash
          npm login
          ```

          2. Entrá al paquete:

          ```bash
          cd packages/embed
          ```

          3. Publicá (te pide el código de verificación en dos pasos):

          ```bash
          npm publish --access public
          ```

          4. Comprobá que https://www.npmjs.com/package/@scrolllab/embed diga **__VERSION__**.

          El paquete ya armado está como *artifact* en el [run](__RUN_URL__), por si querés revisarlo antes.
          TEMPLATE
              )
              ;;
            needs-bump)
              TITLE="Subir la versión de @scrolllab/embed: cambió pero sigue en $VERSION"
              ACTION="npm no deja publicar dos veces el mismo número. Subí la versión en \`packages/embed/package.json\` (por ejemplo a la siguiente patch), commiteá y subí a \`master\`: este aviso se actualiza solo con los pasos para publicar."
              ;;
            version-behind)
              TITLE="Revisar la versión de @scrolllab/embed: $VERSION es menor que la publicada"
              ACTION="La versión del repo es menor o igual que la última publicada en npm. Subila por encima de \`__LATEST__\` en \`packages/embed/package.json\`."
              ;;
            *)
              echo "estado desconocido: $STATUS"
              exit 1
              ;;
          esac
          ACTION="${ACTION//__VERSION__/$VERSION}"
          ACTION="${ACTION//__RUN_URL__/$RUN_URL}"
          ACTION="${ACTION//__LATEST__/$LATEST}"

          {
            echo "$REASON"
            echo
            echo "**Última publicada en npm:** \`$LATEST\`  ·  **En el repo:** \`$VERSION\`"
            echo
            echo "${CHANGES:-_(sin diferencias de archivos)_}"
            echo
            echo "$ACTION"
            echo
            echo "_Aviso automático de [embed-release]($RUN_URL). Se cierra solo cuando npm coincide con el repo._"
          } > body.md

          if [ -n "$OPEN" ]; then
            CUR=$(gh issue view "$OPEN" --json title --jq .title)
            gh issue edit "$OPEN" --title "$TITLE" --body-file body.md
            if [ "$CUR" != "$TITLE" ]; then
              gh issue comment "$OPEN" --body "Cambió lo pendiente: ahora es **$TITLE**."
            fi
          else
            gh issue create --title "$TITLE" --body-file body.md --label "$LABEL" --assignee "$OWNER"
          fi
